name: Process Scheduled Posts

env:
  SCHEDULER_FUNCTION_URL: https://qydjsobtspoykhzcckht.supabase.co/functions/v1/process-scheduled-posts

on:
  schedule:
    # Run every 5 minutes on an offset cadence to avoid the busiest minute buckets,
    # which GitHub notes are more likely to be delayed or dropped under load.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  trigger-scheduler:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger Supabase Edge Function
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Missing GitHub Actions secret CRON_SECRET."
            exit 1
          fi

          echo "Triggering ${SCHEDULER_FUNCTION_URL}"
          http_code=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            -X POST "${SCHEDULER_FUNCTION_URL}" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}")

          echo "HTTP ${http_code}"
          cat response.json

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Scheduler trigger failed with HTTP ${http_code}."
            exit 1
          fi
